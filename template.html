<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contrataciones · Sanidad GVA</title>
<meta property="og:type" content="website">
<meta property="og:title" content="Contrataciones · Sanidad GVA · Intersindical Salut">
<meta property="og:description" content="Filtra las contrataciones por categoría, departamento, turno, nombramiento, breve y jornada, y consulta nombre y puesto.">
<meta property="og:image" content="https://intersindicalorihuela.github.io/Contrataciones/icon-512.png">
<meta property="og:url" content="https://intersindicalorihuela.github.io/Contrataciones/">
<meta name="twitter:card" content="summary">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contrataciones">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#BB2B09">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" type="image/png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --ink:#1D1B1A;
    --ink-soft:#5C544F;
    --paper:#F6F2EC;
    --paper-card:#FFFDF9;
    --red:#BB2B09;
    --red-deep:#8A2007;
    --red-tint:#FBEAE4;
    --red-tint-border:#F0C4B6;
    --green:#2F6B4F;
    --rust:#7A4136;
    --gold:#FF6A45;
    --line:#E3D9CF;
    --line-soft:#ECE4DB;
    --shadow: 0 1px 2px rgba(29,27,26,0.06), 0 8px 24px rgba(29,27,26,0.08);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }

  .accent-bar{
    height:6px;
    background:var(--red);
  }
  .top{
    padding:2.2rem 2rem 1.6rem;
    max-width:1180px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:1.5rem;
    flex-wrap:wrap;
    border-bottom:1px solid var(--line);
  }
  .brand{
    display:flex;
    align-items:flex-start;
    gap:1.1rem;
  }
  .brand img.logo{
    height:76px;
    width:auto;
    flex-shrink:0;
    margin-top:0.2rem;
  }
  .brand-eyebrow{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.86rem;
    font-weight:600;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--red-deep);
    background:var(--red-tint);
    border-left:4px solid var(--red);
    border-radius:0 4px 4px 0;
    padding:0.3rem 0.75rem;
    margin:0 0 0.6rem;
  }
  .brand-eyebrow b{font-weight:700;color:var(--red);}
  .brand-eyebrow .loc{text-transform:none;letter-spacing:0.04em;font-weight:600;}
  h1{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:2.1rem;
    line-height:1.15;
    margin:0;
    color:var(--ink);
  }
  .top p{
    max-width:38ch;
    margin:0.6rem 0 0;
    color:var(--ink-soft);
    font-size:0.92rem;
    line-height:1.5;
  }
  .stamp{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.7rem;
    letter-spacing:0.06em;
    color:var(--red-deep);
    border:1.5px solid var(--red);
    border-radius:3px;
    padding:0.5rem 0.8rem;
    transform:rotate(-2deg);
    white-space:nowrap;
    opacity:0.85;
  }

  .layout{
    max-width:1180px;
    margin:0 auto;
    padding:2rem 2rem 4rem;
    display:grid;
    grid-template-columns:340px 1fr;
    gap:2rem;
    align-items:start;
  }

  @media (max-width:860px){
    .layout{grid-template-columns:1fr;}
    .top{padding:2rem 1.2rem 1.4rem;}
    .layout{padding:1.6rem 1.2rem 3rem;}
  }

  .mobile-bar{
    display:none;
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:20;
    background:var(--ink);
    color:#F7EFEA;
    padding:0.7rem 1.1rem;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 -4px 16px rgba(0,0,0,0.18);
  }
  .mobile-bar .lbl{
    font-size:0.72rem;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:#D9A897;
  }
  .mobile-bar .val{
    font-family:'IBM Plex Mono',monospace;
    font-size:1.15rem;
    font-weight:600;
    color:var(--gold);
    font-variant-numeric:tabular-nums;
  }
  @media (max-width:860px){
    .mobile-bar{display:flex;}
  }

  /* --- FORM --- */
  .panel{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:1.5rem 1.4rem 1.7rem;
    position:sticky;
    top:1.5rem;
    box-shadow:var(--shadow);
  }
  .panel h2{
    font-family:'Source Serif 4',serif;
    font-size:1.05rem;
    font-weight:600;
    margin:0 0 1.1rem;
    color:var(--ink);
  }
  .field{margin-bottom:1.1rem;}
  .field label{
    display:block;
    font-size:0.76rem;
    font-weight:600;
    letter-spacing:0.02em;
    color:var(--ink-soft);
    margin-bottom:0.35rem;
    text-transform:uppercase;
  }
  .field .hint{
    font-size:0.72rem;
    color:#7C8B85;
    margin-top:0.3rem;
    font-weight:400;
    text-transform:none;
    letter-spacing:0;
  }
  select, input[type=number], input[type=text], input[type=email], input[type=password]{
    width:100%;
    font-family:'Inter',sans-serif;
    font-size:0.9rem;
    padding:0.55rem 0.65rem;
    border:1px solid var(--line);
    border-radius:6px;
    background:#fff;
    color:var(--ink);
  }
  select:focus, input:focus{
    outline:2px solid var(--red);
    outline-offset:1px;
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:0.7rem;}
  .checkline{
    display:flex;
    align-items:center;
    gap:0.55rem;
    padding:0.5rem 0.1rem;
  }
  .checkline input{width:auto;accent-color:var(--red);}
  .checkline label{
    margin:0;
    text-transform:none;
    font-size:0.85rem;
    font-weight:500;
    color:var(--ink);
    letter-spacing:0;
  }
  hr.sep{
    border:none;
    border-top:1px dashed var(--line);
    margin:1.3rem 0;
  }

  /* --- LEDGER --- */
  .ledger{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .ledger-head{
    position:relative;
    padding:1.4rem 1.7rem 1.1rem;
    border-bottom:1px dashed var(--line);
    background:
      radial-gradient(circle at 12px 0, transparent 6px, var(--paper-card) 6.5px) top left / 24px 12px repeat-x;
  }
  .ledger-head::before{
    content:"";
    position:absolute;
    top:-1px;left:0;right:0;height:12px;
    background:var(--paper);
    border-radius:0 0 0 0;
    -webkit-mask: radial-gradient(circle at 12px 6px, transparent 6px, black 6.5px) top / 24px 12px repeat-x;
    mask: radial-gradient(circle at 12px 6px, transparent 6px, black 6.5px) top / 24px 12px repeat-x;
  }
  .ledger-brand{
    display:flex;
    align-items:center;
    gap:0.9rem;
    margin:0 0 1.1rem;
    padding-bottom:1rem;
    border-bottom:1px dashed var(--line);
  }
  .ledger-brand img{height:60px;width:auto;flex-shrink:0;}
  .ledger-brand .brand-eyebrow{font-size:0.7rem;padding:0.25rem 0.6rem;margin:0 0 0.45rem;}
  .ledger-brand-title{
    font-family:'Source Serif 4',serif;
    font-weight:600;
    font-size:1.3rem;
    line-height:1.15;
    color:var(--ink);
  }
  .ledger-head h3{
    font-family:'Source Serif 4',serif;
    font-size:1.15rem;
    margin:0 0 0.15rem;
  }
  .ledger-head .puesto{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--red-deep);
  }

  .section{padding:1.3rem 1.7rem;}
  .section + .section{border-top:1px solid var(--line-soft);}
  .section h4.h4-no-oficial{font-size:0.62rem;text-transform:none;letter-spacing:0.04em;font-weight:500;}
  .section h4{
    font-family:'IBM Plex Mono',monospace;
    text-transform:uppercase;
    font-size:0.74rem;
    letter-spacing:0.1em;
    color:var(--ink-soft);
    margin:0 0 0.8rem;
  }
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:1.6rem;}
  @media (max-width:640px){.cols{grid-template-columns:1fr;}}

  .concept-list{list-style:none;margin:0;padding:0;}
  .concept-list li{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:0.32rem 0;
    font-size:0.86rem;
    gap:0.6rem;
  }
  .concept-list li span:first-child{color:var(--ink-soft);}
  .concept-list li span:last-child{
    font-family:'IBM Plex Mono',monospace;
    font-variant-numeric: tabular-nums;
    font-size:0.86rem;
    color:var(--ink);
    white-space:nowrap;
  }
  .devengo span:last-child{color:var(--green);}
  .deduccion span:last-child{color:var(--rust);}

  .subtotal{
    display:flex;justify-content:space-between;
    font-weight:600;font-size:0.88rem;
    border-top:1px solid var(--line);
    margin-top:0.5rem;padding-top:0.5rem;
  }
  .subtotal span:last-child{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

  .liquido-bar{
    margin-top:1rem;
    background:var(--red-tint);
    border:1px solid var(--red-tint-border);
    border-radius:7px;
    padding:0.7rem 1rem;
    display:flex;justify-content:space-between;align-items:center;
  }
  .liquido-bar .lbl{font-size:0.82rem;font-weight:600;color:var(--red-deep);text-transform:uppercase;letter-spacing:0.04em;}
  .liquido-bar .val{font-family:'IBM Plex Mono',monospace;font-size:1.05rem;font-weight:600;color:var(--red-deep);font-variant-numeric:tabular-nums;}

  .extra-note{
    font-size:0.78rem;
    color:var(--ink-soft);
    margin-top:0.9rem;
    padding-top:0.7rem;
    border-top:1px dashed var(--line-soft);
  }
  .extra-note b{color:var(--ink);font-family:'IBM Plex Mono',monospace;}

  .found-box{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:8px;
    padding:0.8rem 1rem;
    margin-top:0.4rem;
  }
  .found-row{
    display:flex; justify-content:space-between; gap:0.8rem;
    padding:0.3rem 0; font-size:0.86rem; color:var(--ink-soft);
    border-bottom:1px dashed var(--line-soft);
  }
  .found-row:last-child{border-bottom:none;}
  .found-row b{color:var(--ink); font-weight:600; text-align:right;}

  .total-section{
    background:#241411;
    color:#F7EFEA;
    padding:1.5rem 1.7rem 1.7rem;
  }
  .total-section h4{color:#D9A897;}
  .total-rows{list-style:none;margin:0 0 1rem;padding:0;}
  .total-rows li{
    display:flex;justify-content:space-between;
    padding:0.3rem 0;font-size:0.86rem;color:#DCC3B9;
  }
  .total-rows li span:last-child{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}
  .grand-total{
    display:flex;justify-content:space-between;align-items:baseline;
    border-top:1px solid #47231C;
    padding-top:0.9rem;
  }
  .grand-total .lbl{
    font-family:'Source Serif 4',serif;
    font-size:1rem;
    color:#F4F7F5;
  }
  .grand-total .val{
    font-family:'IBM Plex Mono',monospace;
    font-size:1.65rem;
    font-weight:600;
    color:var(--gold);
    font-variant-numeric:tabular-nums;
  }

  .footnote{
    max-width:1180px;margin:0 auto;padding:0 2rem 3rem;
    font-size:0.76rem;color:var(--ink-soft);line-height:1.6;
  }
  @media (max-width:860px){.footnote{padding:0 1.2rem 2.4rem;}}

  /* Mobile stacking: placed last on purpose so it overrides the
     desktop .panel/.ledger rules above at this breakpoint. */
  @media (max-width:860px){
    .panel{order:1;position:static;top:auto;}
    .ledger{order:2;}
    body{padding-bottom:64px;}
  }
  /* --- LOGIN OVERLAY --- */
  .login-overlay{
    position:fixed; inset:0;
    background:var(--paper);
    display:flex; align-items:center; justify-content:center;
    z-index:9999; padding:1.5rem;
  }
  .login-card{
    background:var(--paper-card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:2rem 1.8rem;
    max-width:420px; width:100%;
    box-shadow:var(--shadow);
  }
  .login-eyebrow{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.8rem; font-weight:600; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--red-deep); background:var(--red-tint);
    border-left:4px solid var(--red); border-radius:0 4px 4px 0;
    padding:0.28rem 0.7rem; margin:0 0 0.7rem;
  }
  .login-eyebrow b{font-weight:700;color:var(--red);}
  .login-eyebrow .loc{text-transform:none;letter-spacing:0.04em;}
  .login-title{
    font-family:'Source Serif 4',serif; font-weight:600;
    font-size:1.5rem; line-height:1.2; margin:0 0 0.8rem; color:var(--ink);
  }
  .login-desc{ font-size:0.86rem; color:var(--ink-soft); line-height:1.5; margin:0 0 1.3rem; }
  .login-error{
    background:var(--red-tint); border:1px solid var(--red-tint-border);
    color:var(--red-deep); font-size:0.82rem; padding:0.6rem 0.8rem;
    border-radius:6px; margin-bottom:1rem;
  }
  .login-submit{ width:100%; margin-top:0.4rem; padding:0.75rem; font-size:0.95rem; }
  .password-wrap{ position:relative; }
  .password-wrap input{ padding-right:3.4rem; }
  .toggle-pass{
    position:absolute; right:0.35rem; top:50%; transform:translateY(-50%);
    background:none; border:none; cursor:pointer; font-family:'Inter',sans-serif;
    font-size:0.76rem; font-weight:600; color:var(--red-deep); padding:0.3rem 0.4rem;
  }
  .login-footnote{ font-size:0.76rem; color:var(--ink-soft); margin:1.2rem 0 0; text-align:center; }

  .install-help{ margin-top:1rem; border-top:1px solid var(--line); padding-top:0.8rem; }
  .install-help summary{
    font-size:0.8rem; font-weight:600; color:var(--red-deep); cursor:pointer;
    list-style:none; text-align:center;
  }
  .install-help summary::-webkit-details-marker{ display:none; }
  .install-help summary::after{ content:' ▾'; }
  .install-help[open] summary::after{ content:' ▴'; }
  .install-help-body{ font-size:0.78rem; color:var(--ink-soft); line-height:1.5; margin-top:0.6rem; }
  .install-help-body p{ margin:0 0 0.5rem; }

  /* --- LANGUAGE SWITCH --- */
  .lang-switch{ display:flex; justify-content:center; gap:0.4rem; margin-top:1rem; }
  .lang-switch-app{ margin-top:0; justify-content:flex-start; }
  .lang-btn{
    background:#fff; border:1px solid var(--line); color:var(--ink-soft);
    font-size:0.72rem; font-weight:700; letter-spacing:0.03em;
    padding:0.25rem 0.55rem; border-radius:5px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .lang-btn.active{ background:var(--red); color:#fff; border-color:var(--red); }
  .user-bar .lang-btn{ background:transparent; border-color:#5C4A3E; color:var(--ink-soft); }
  .user-bar .lang-btn.active{ background:var(--red); color:#fff; border-color:var(--red); }

  /* --- CONTACT LINK --- */
  .contact-link{ margin-right:auto; }

  /* --- USER BAR --- */
  .user-bar{
    max-width:1180px; margin:0 auto; padding:0.6rem 2rem 0;
    display:flex; justify-content:flex-end; align-items:center; gap:0.8rem;
    font-size:0.8rem; color:var(--ink-soft);
  }
  @media (max-width:860px){ .user-bar{ padding:0.6rem 1.2rem 0; } }
  .link-btn{
    background:none; border:none; color:var(--red-deep); text-decoration:underline;
    cursor:pointer; font-size:0.8rem; padding:0; font-family:'Inter',sans-serif;
  }

  /* --- BUTTONS --- */
  .btn-primary{
    background:var(--red); color:#fff; border:none;
    padding:0.65rem 1.1rem; border-radius:6px; font-weight:600;
    cursor:pointer; font-size:0.9rem; font-family:'Inter',sans-serif;
  }
  .btn-primary:hover{ background:var(--red-deep); }
  .btn-secondary{
    background:#fff; color:var(--red-deep); border:1px solid var(--red);
    padding:0.65rem 1.1rem; border-radius:6px; font-weight:600;
    cursor:pointer; font-size:0.9rem; font-family:'Inter',sans-serif;
  }
  .btn-secondary:hover{ background:var(--red-tint); }

  /* --- ACTIONS (inside dark total-section) --- */
  .actions{ margin-top:1.1rem; padding-top:1rem; border-top:1px solid #47231C; }
  .actions .field{ margin-bottom:0.8rem; }
  .actions .field label{
    color:#D9A897; display:block; font-size:0.76rem; font-weight:600;
    letter-spacing:0.02em; text-transform:uppercase; margin-bottom:0.35rem;
  }
  .actions .field input{
    width:100%; background:#33201B; border:1px solid #55322A; color:#F7EFEA;
    padding:0.55rem 0.65rem; border-radius:6px; font-family:'Inter',sans-serif; font-size:0.9rem;
  }
  .actions-buttons{ display:flex; gap:0.7rem; flex-wrap:wrap; }
  .actions-hint{ color:#C9A99C; margin-top:0.6rem; font-size:0.74rem; line-height:1.4; }

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 .8rem;}
  .res{list-style:none;margin:0;padding:0;}
  .res li{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;padding:.55rem 0;border-bottom:1px solid var(--line-soft);font-size:.86rem;}
  .res .nm{font-weight:600;}
  .res .meta{display:block;font-size:.72rem;color:var(--ink-soft);margin-top:.15rem;}
  .res .pz{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .bdg{display:inline-block;font-size:.66rem;font-weight:700;padding:.05rem .45rem;border-radius:99px;margin-left:.4rem;vertical-align:middle;}
  .bdg.C{background:var(--red-tint);color:var(--red-deep);border:1px solid var(--red-tint-border);}
  .bdg.I{background:#FFF4D6;color:#7A5A00;border:1px solid #EBD38A;}
  .bdg.L{background:#E4F0EA;color:var(--green);border:1px solid #BCD8C9;}
  .legend{font-size:.74rem;color:var(--ink-soft);line-height:1.5;margin-top:.8rem;}
  .btn-row{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:1rem;}
</style>
</head>
<body>

<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <p class="login-eyebrow"><b>Intersindical Salut</b> &middot; <span class="loc">Orihuela</span></p>
    <h1 class="login-title" data-i18n="app_title_html"></h1>
    <p class="login-desc" data-i18n="login_desc"></p>
    <form id="loginForm">
      <div class="field"><label for="loginNombre" data-i18n="label_nombre"></label>
        <input type="text" id="loginNombre" required autocomplete="given-name"></div>
      <div class="field"><label for="loginCodigo" data-i18n="label_codigo"></label>
        <div class="password-wrap">
          <input type="password" id="loginCodigo" required autocomplete="off">
          <button type="button" id="togglePass" class="toggle-pass">Ver</button>
        </div></div>
      <div id="loginError" class="login-error" style="display:none;"></div>
      <button type="submit" class="btn-primary login-submit" data-i18n="btn_entrar"></button>
    </form>
    <p class="login-footnote" data-i18n="login_footnote"></p>
    <div class="lang-switch">
      <button type="button" class="lang-btn" data-lang="es">ES</button>
      <button type="button" class="lang-btn" data-lang="va">VA</button>
    </div>
  </div>
</div>

<div id="appRoot" style="display:none;">
<div class="user-bar">
  <a class="link-btn contact-link" href="mailto:intersindicalorihuela@gmail.com" data-i18n="contact_text"></a>
  <div class="lang-switch lang-switch-app">
    <button type="button" class="lang-btn" data-lang="es">ES</button>
    <button type="button" class="lang-btn" data-lang="va">VA</button>
  </div>
  <span data-i18n="session_label"></span> <b id="userNombre">&mdash;</b>
  <button type="button" id="logoutBtn" class="link-btn" data-i18n="logout_btn"></button>
</div>
<div class="accent-bar"></div>

  b:{S:'Sí (menys de 3 mesos)',N:'No (3 mesos o més)'},
  jor:{A:'ATC',N:'Ordinària',P:'Temps parcial'}}
};
const CAT_VA = {'ADMINISTRATIVO':'ADMINISTRATIU','AUXILIAR ADMINISTRATIVO':'AUXILIAR ADMINISTRATIU','ENFERMERA/O':'INFERMER/A',
 'TÉCNICO/A EN CUIDADOS AUXILIARES DE ENFERMERÍA':"TÈCNIC/A EN CURES AUXILIARS D'INFERMERIA",'T.E. LABORATORIO':'T.E. LABORATORI',
 'T.E. EN IMAGEN PARA EL DIAGNÓSTICO Y MEDICINA NUCLEAR':'T.E. EN IMATGE PER AL DIAGNÒSTIC I MEDICINA NUCLEAR','TÉCNICO/A EN FARMACIA':'TÈCNIC/A EN FARMÀCIA'};
const PERF_VA = {'Área de pacientes críticos':'Àrea de pacients crítics','Área de quirófano':'Àrea de quiròfan','Hemodiálisis':'Hemodiàlisi','Intervencionismo':'Intervencionisme','Hemodinámica':'Hemodinàmica'};
const HTML_KEYS = new Set(['app_title_html','legend_html']);
const L = () => I18N[LANG];
const tCat = c => LANG==='va' ? (CAT_VA[c]||c) : c;
const tPerf = p => LANG==='va' ? (PERF_VA[p]||p) : p;

// ---- datos: fila = [nombre,cat,perfil,dpto,puesto,ini,fin,turno,tnom,b,jor] (fechas = días desde 1970)
const R = DATA.rows, CORTE0 = DATA.corte;
const fmt = d => { if(d==null) return '—'; const x=new Date(d*86400000); return String(x.getUTCDate()).padStart(2,'0')+'/'+String(x.getUTCMonth()+1).padStart(2,'0')+'/'+x.getUTCFullYear(); };
const toISO = d => new Date(d*86400000).toISOString().slice(0,10);
const fromISO = s => Math.round(Date.parse(s+'T00:00:00Z')/86400000);
const norm = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

let corte = CORTE0;
// C = corto (<=5 días) · L = no corto · I = indeterminado
function clasif(r){
  if(r[6]!=null) return (r[6]-r[5]+1)<=5 ? 'C' : 'L';
  return (corte-r[5]+1)<=5 ? 'I' : 'L';
}
function dias(r){ return r[6]!=null ? r[6]-r[5]+1 : null; }

function fillSel(id, pairs, allLabel){
  const sel=$(id), prev=sel.value; sel.innerHTML='';
  const o=document.createElement('option'); o.value=''; o.textContent=allLabel; sel.appendChild(o);
  pairs.forEach(([v,t])=>{const e=document.createElement('option'); e.value=v; e.textContent=t; sel.appendChild(e);});
  if([...sel.options].some(o=>o.value===prev)) sel.value=prev;
}
function populate(){
  const t=L();
  fillSel('fCat', DATA.cats.map((c,i)=>[String(i),tCat(c)]).sort((a,b)=>a[1].localeCompare(b[1])), t.all_f);
  fillSel('fDpto', DATA.dptos.map((d,i)=>[String(i),d]).sort((a,b)=>a[1].localeCompare(b[1])), t.all);
  fillSel('fTurno', Object.entries(t.turno), t.all);
  fillSel('fJor', Object.entries(t.jor), t.all_f);
  fillSel('fTnom', Object.entries(t.tnom), t.all);
  fillSel('fB', Object.entries(t.b), t.all);
  fillSel('fDur', Object.entries(t.dur).filter(e=>e[0]), t.all);
  populatePerfiles();
}
function populatePerfiles(){
  const c=$('fCat').value; let idx=[];
  if(c!==''){ const s=new Set(); R.forEach(r=>{ if(String(r[1])===c && r[2]>=0) s.add(r[2]); }); idx=[...s]; }
  $('perfilField').style.display = idx.length ? '' : 'none';
  fillSel('fPerfil', idx.map(i=>[String(i),tPerf(DATA.perfiles[i])]).sort((a,b)=>a[1].localeCompare(b[1])), L().all);
  if(!idx.length) $('fPerfil').value='';
}

let ultimo=[];
function actualizar(){
  const t=L(), f={cat:$('fCat').value,perf:$('fPerfil').value,dpto:$('fDpto').value,turno:$('fTurno').value,jor:$('fJor').value,tnom:$('fTnom').value,b:$('fB').value,dur:$('fDur').value};
  const out=[]; const cnt={C:0,L:0,I:0};
  for(const r of R){
    if(f.cat!=='' && String(r[1])!==f.cat) continue;
    if(f.perf!=='' && String(r[2])!==f.perf) continue;
    if(f.dpto!=='' && String(r[3])!==f.dpto) continue;
    if(f.turno && r[7]!==f.turno) continue;
    if(f.jor && r[10]!==f.jor) continue;
    if(f.tnom && r[8]!==f.tnom) continue;
    if(f.b && r[9]!==f.b) continue;
    const k=clasif(r);
    if(f.dur && k!==f.dur) continue;
    cnt[k]++; out.push([r,k]);
  }
  out.sort((a,b)=>{ const pa=a[0][4], pb=b[0][4]; if(pa==null&&pb!=null) return 1; if(pb==null&&pa!=null) return -1; if(pa!==pb && pa!=null) return pa-pb; return a[0][0].localeCompare(b[0][0]); });
  ultimo=out;
  $('nC').textContent=cnt.C.toLocaleString('es-ES'); $('nL').textContent=cnt.L.toLocaleString('es-ES'); $('nI').textContent=cnt.I.toLocaleString('es-ES');
  $('nTotal').textContent=out.length.toLocaleString('es-ES'); $('mobileVal').textContent=out.length.toLocaleString('es-ES');
  const parts=[];
  if(f.cat!=='') parts.push(tCat(DATA.cats[f.cat]));
  if(f.perf!=='') parts.push(tPerf(DATA.perfiles[f.perf]));
  if(f.dpto!=='') parts.push(DATA.dptos[f.dpto]);
  if(f.turno) parts.push(t.turno[f.turno]); if(f.tnom) parts.push(t.tnom[f.tnom]);
  if(f.b) parts.push(t.l_b+': '+t.b[f.b]); if(f.jor) parts.push(t.jor[f.jor]); if(f.dur) parts.push(t.dur[f.dur]);
  $('filtrosTxt').textContent = parts.length ? parts.join(' · ') : t.none;
  const MAX=300, ul=$('lista'); ul.innerHTML='';
  out.slice(0,MAX).forEach(([r,k])=>{
    const li=document.createElement('li'), d=dias(r);
    const dtxt = d==null ? t.abierto : d+' '+(d===1?t.dia:t.dias);
    const left=document.createElement('span');
    left.innerHTML='<span class="nm"></span><span class="bdg '+k+'"></span><span class="meta"></span>';
    left.children[0].textContent=r[0];
    left.children[1].textContent=t.dur[k].split(' (')[0].replace(/s$/,'');
    left.children[2].textContent=fmt(r[5])+' → '+fmt(r[6])+' · '+dtxt+' · '+tCat(DATA.cats[r[1]])+' · '+DATA.dptos[r[3]];
    const pz=document.createElement('span'); pz.className='pz'; pz.textContent=r[4]==null?t.sinpuesto:'Nº '+r[4];
    li.appendChild(left); li.appendChild(pz); ul.appendChild(li);
  });
  const av=$('aviso'); av.style.display = out.length>MAX ? '' : 'none';
  av.textContent = t.aviso.replace('{n}',MAX).replace('{t}',out.length.toLocaleString('es-ES'));
  $('sinRes').style.display = out.length ? 'none' : '';
}

function csv(){
  const t=L(), q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Nombre','Puesto','Categoría','Perfil','Departamento','Turno','Tipo nombramiento','Breve','Jornada','Inicio','Fin','Días','Duración'].map(q).join(';')];
  ultimo.forEach(([r,k])=>rows.push([r[0],r[4],tCat(DATA.cats[r[1]]),r[2]>=0?tPerf(DATA.perfiles[r[2]]):'',DATA.dptos[r[3]],r[7],r[8],r[9],r[10],fmt(r[5]),r[6]==null?'':fmt(r[6]),dias(r)==null?'':dias(r),t.dur[k]].map(q).join(';')));
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\r\n')],{type:'text/csv;charset=utf-8'}));
  a.download='contrataciones.csv'; document.body.appendChild(a); a.click(); a.remove();
}

function applyLanguage(lang){
  LANG = lang==='va' ? 'va' : 'es'; sSet('contrataciones_lang',LANG); document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{ const k=el.dataset.i18n, v=L()[k]; if(typeof v!=='string') return; HTML_KEYS.has(k)?el.innerHTML=v:el.textContent=v; });
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.dataset.lang===LANG));
  $('loginNombre').placeholder=L().label_nombre; $('loginCodigo').placeholder=L().label_codigo;
  populate(); actualizar();
  $('fechaActualizacion').textContent=fmt(DATA.maxfecha);
}
document.addEventListener('click',e=>{const b=e.target.closest('.lang-btn'); if(b) applyLanguage(b.dataset.lang);});
$('fCat').addEventListener('change',()=>{populatePerfiles(); actualizar();});
['fPerfil','fDpto','fTurno','fJor','fTnom','fB','fDur'].forEach(id=>$(id).addEventListener('change',actualizar));
$('fCorte').value=toISO(CORTE0);
$('fCorte').addEventListener('change',()=>{ const v=$('fCorte').value; corte = v ? fromISO(v) : CORTE0; actualizar(); });
$('btnReset').addEventListener('click',()=>{ ['fCat','fPerfil','fDpto','fTurno','fJor','fTnom','fB','fDur'].forEach(id=>$(id).value=''); populatePerfiles(); corte=CORTE0; $('fCorte').value=toISO(CORTE0); actualizar(); });
$('btnCsv').addEventListener('click',csv);
$('ledgerLogo').src=document.querySelector('.brand img.logo').src;
applyLanguage(LANG);

(function(){
  const CODE='IntersindicalSalut', AUTH_KEY='intersindical_nomina_auth';
  function showApp(n){ $('loginOverlay').style.display='none'; $('appRoot').style.display='block'; $('userNombre').textContent=n||''; }
  $('togglePass').addEventListener('click',()=>{ const p=$('loginCodigo'), s=p.type==='text'; p.type=s?'password':'text'; $('togglePass').textContent=s?'Ver':'Ocultar'; });
  $('loginForm').addEventListener('submit',e=>{
    e.preventDefault(); const n=$('loginNombre').value.trim(), er=$('loginError');
    if(!n){ er.textContent=L().err_nombre; er.style.display='block'; return; }
    if($('loginCodigo').value!==CODE){ er.textContent=L().err_codigo; er.style.display='block'; return; }
    er.style.display='none'; sSet(AUTH_KEY,JSON.stringify({nombre:n,ts:Date.now()})); showApp(n);
  });
  $('logoutBtn').addEventListener('click',()=>{ sDel(AUTH_KEY); location.reload(); });
  let s=null; try{ s=JSON.parse(sGet(AUTH_KEY)||'null'); }catch(e){}
  if(s && s.nombre) showApp(s.nombre);
})();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
