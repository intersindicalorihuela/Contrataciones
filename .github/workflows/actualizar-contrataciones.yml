name: Actualizar contrataciones

on:
  push:
    paths:
      - 'data/Contrataciones.xlsx'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Generar index.html a partir del Excel
        run: python convert.py data/Contrataciones.xlsx

      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Actualiza datos de contrataciones ($(date +%F))"
          git push
